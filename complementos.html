<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>
           Complementos novia
        </title>    
        <style>
            body{
                background:#f5f2ee;
                font-family:Georgia,serif;
                margin:0;
                padding:30px;
            }

            h1{
                text-align:center;
                font-size:48px;
                color:#c4c2c0;
                margin-bottom:40px;
            }   
            #productos{
                display:grid;
                grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
                gap:20px;
            }

            .card{
                background:white;
                border-radius:16px;
                overflow:hidden;
                box-shadow:0 8px 25px rgba(0,0,0,.08);
                transition:all .3s ease;
            }

            .card:hover{
                transform:translateY(-5px);
            }

            .card img{
                width:100%;
                height:350px;
                object-fit:cover;
            }

            .card h3{
                text-align:center;
                color:#5f5750;
            }

            .card p{
                padding-left:15px;
                padding-right:15px;
            }
            .volver{
                display:inline-block;
                margin-bottom:30px;
                color:#8b7d6b;
                text-decoration:none;
                font-size:14px;
                letter-spacing:1px;
            }

            .volver:hover{
                color:#5f5750;
            }
           
            .btn-secundario:hover{
                background:#cbb79d;
            }
            .btn-secundario{
                display:inline-block;
                margin-left:20px;
                padding:10px 20px;
                border-radius:20px;
                background:#d8c8b4;
                color:#5f5750;
                text-decoration:none;
            }

            .btn-secundario:hover{
                background:#cbb79d;
            }


        </style>     
            
      
    </head>
    <body>
        <a href="index.html" class="volver">
        ← Volver al inicio
        </a>
        <a href="NOVIA.html" class="btn-secundario">
        Ver vestidos
        </a>
        <h1>
            Complementos novia
        </h1>
        <div id="productos">
        </div>
        <script>
            fetch("listado_de_vestidos_completo.csv")           
            .then(r => r.text())
            .then(texto => {

            const lineas = texto.split("\n");

            const contenedor =
            document.getElementById("productos");

            for(let i=1;i<lineas.length;i++){

            const c = lineas[i].split(";");
            if(c[2] != "NOVIA-COMPLEMENTO") continue;

            if(c.length < 10) continue;

            const bloque = document.createElement("div");
            bloque.style.cursor = "pointer";
            bloque.className = "card";
            let codigo = c[0].padStart(2,"0");
            bloque.dataset.codigo = c[0];
            bloque.dataset.firma = c[9];
            bloque.dataset.talla = c[3];
            bloque.dataset.color = c[8];
            bloque.dataset.estado = c[4];
            bloque.dataset.material = c[7];
            bloque.dataset.modelo = c[6];
            bloque.dataset.comentario = c[11];

          bloque.innerHTML =

            '<img src="FOTOS/' + codigo + '_1.png">' +

            '<h3>' + c[11].split("Precio")[0].trim() + '</h3>' +

            '<p><b>Codigo:</b> ' + c[0] + '</p>' +

            (c[3] ? '<p><b>Talla:</b> ' + c[3] + '</p>' : '') +

            (c[8] ? '<p><b>Color:</b> ' + c[8] + '</p>' : '');
            contenedor.appendChild(bloque);
            bloque.onclick = function(){

            window.location.href =
            "complementosNovia-detalle.html?id=" + c[0];

            };
            let img = bloque.querySelector("img");
            img.onerror = function(){

                img.onerror = function(){

                    img.onerror = function(){

                        img.onerror = function(){

                            img.src =
                            "FOTOS/" + codigo + "_2.png";

                        };

                        img.src =
                        "FOTOS/" + codigo + "_1.webp";

                    };

                    img.src =
                    "FOTOS/" + codigo + "_1.jpeg";

                };

                img.src =
                "FOTOS/" + codigo + "_1.jpg";

            };

            }

            });
        </script>
       
    </body>
</html>
